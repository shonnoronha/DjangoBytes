{% extends 'base.html' %}

{% block head %}
    <title>Logout</title>
{% endblock head %}

{% block content %}
    <div class="text-center">
        <h2 class="fs-1">Confirm Logout ?</h2>
        <form action="." method="post" style="display: inline;">
            {% csrf_token %}
            <button class="me-4 mt-3 btn btn-outline-success" type="submit">
                Logout
            </button>
        </form>
        <button class="ms-4 mt-3 btn btn-outline-danger" onclick="history.back()">
            Cancel
        </button>
    </div>
{% endblock content %}
